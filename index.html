<script>
        const API_URL = 'http://localhost:3001/api/bookings';
        let currentBookingId = null;

        // Установка минимального времени (нельзя записаться в прошлое)
        function setMinDateTime() {
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('datetime').min = now.toISOString().slice(0, 16);
        }
        window.onload = setMinDateTime;

        // Отправка формы записи на сервер
        document.getElementById('booking-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const phoneInput = document.getElementById('phone').value.trim();
            const cleanPhone = phoneInput.replace(/\D/g, '');

            if (cleanPhone.length < 10 || cleanPhone.length > 12) {
                alert('Неверный формат телефона! Введите от 10 до 12 цифр.');
                return;
            }

            const selectedDatetime = document.getElementById('datetime').value;
            const nowIso = new Date().toISOString().slice(0, 16);
            if (selectedDatetime < nowIso) {
                alert('Нельзя записаться на прошедшее время!');
                return;
            }

            const selectedMaster = document.getElementById('master').value;

            const newBooking = {
                name: document.getElementById('name').value,
                phone: cleanPhone,
                service: document.getElementById('service').value,
                master: selectedMaster,
                datetime: selectedDatetime
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newBooking)
                });

                const data = await response.json();
                if (!response.ok) {
                    alert(data.error || 'Ошибка при создании записи');
                    return;
                }

                alert('Вы успешно записались!');
                this.reset();
                setMinDateTime();
            } catch (err) {
                console.error(err);
                alert('Не удалось подключиться к серверу!');
            }
        });

        // Поиск записи клиента по телефону через сервер
        async function checkClientBooking() {
            const phoneInput = document.getElementById('search-phone').value.trim();
            const cleanSearchPhone = phoneInput.replace(/\D/g, '');
            const resultDiv = document.getElementById('client-result');

            if (!cleanSearchPhone) {
                resultDiv.innerHTML = "<p style='color: #c2185b;'>Введите номер телефона для поиска.</p>";
                return;
            }

            try {
                const response = await fetch(API_URL);
                const bookings = await response.json();

                const myBookings = bookings.filter(b => {
                    const cleanStoredPhone = String(b.phone).replace(/\D/g, '');
                    return cleanStoredPhone === cleanSearchPhone || cleanStoredPhone.endsWith(cleanSearchPhone);
                });

                myBookings.sort((a, b) => new Date(a.datetime) - new Date(b.datetime));
                resultDiv.innerHTML = "";

                if (myBookings.length === 0) {
                    resultDiv.innerHTML = "<p style='color: #c2185b;'>Записей на этот номер не найдено.</p>";
                    return;
                }

                const listContainer = document.createElement('div');
                listContainer.className = 'client-booking-list';

                const groupedBookings = {};
                myBookings.forEach(b => {
                    const datePart = b.datetime.split('T')[0];
                    if (!groupedBookings[datePart]) groupedBookings[datePart] = [];
                    groupedBookings[datePart].push(b);
                });

                for (const [date, items] of Object.entries(groupedBookings)) {
                    const dateGroup = document.createElement('div');
                    dateGroup.className = 'booking-date-group';

                    const [year, month, day] = date.split('-');
                    const formattedDate = `${day}.${month}.${year}`;

                    const header = document.createElement('div');
                    header.className = 'booking-date-header';
                    header.innerHTML = `<i class="far fa-calendar-alt"></i> Дата: ${formattedDate}`;
                    dateGroup.appendChild(header);

                    items.forEach(b => {
                        const box = document.createElement('div');
                        box.className = 'booking-details-box';

                        const timeOnly = b.datetime.split('T')[1] || '';
                        box.innerHTML = `
                            <div class="booking-time-client"><i class="far fa-clock"></i> <b>Время:</b> ${timeOnly}</div>
                            <div class="booking-service-client"><i class="fas fa-sparkles"></i> <b>Услуга:</b> ${b.service}</div>
                            <div class="booking-master-client"><i class="fas fa-user-tie"></i> <b>Мастер:</b> <span class="master-name-badge-client">${b.master}</span></div>
                            <button class="cancel-booking-btn" onclick="openCancelConfirmModal(${b.id})">
                                <i class="fas fa-times-circle"></i> Отменить запись
                            </button>
                        `;
                        dateGroup.appendChild(box);
                    });

                    listContainer.appendChild(dateGroup);
                }

                resultDiv.appendChild(listContainer);
            } catch (err) {
                console.error(err);
                resultDiv.innerHTML = "<p style='color: #c2185b;'>Ошибка соединения с сервером.</p>";
            }
        }

        // Модальные окна отмены
        function openCancelConfirmModal(id) {
            currentBookingId = id;
            document.getElementById('cancel-confirm-modal').style.display = 'flex';
        }

        function closeCancelConfirmModal() {
            document.getElementById('cancel-confirm-modal').style.display = 'none';
        }

        function goToReasonModal() {
            closeCancelConfirmModal();
            document.getElementById('cancel-reason-modal').style.display = 'flex';
        }

        function closeCancelReasonModal() {
            document.getElementById('cancel-reason-modal').style.display = 'none';
            currentBookingId = null;
        }

        function backToConfirmModal() {
            document.getElementById('cancel-reason-modal').style.display = 'none';
            document.getElementById('cancel-confirm-modal').style.display = 'flex';
        }

        async function finalCancelBooking() {
            if (!currentBookingId) return;
            const reason = document.getElementById('cancel-reason-select').value;

            try {
                const response = await fetch(`${API_URL}/${currentBookingId}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    alert('Не удалось удалить запись на сервере.');
                    return;
                }

                alert(`Запись успешно отменена. Причина: ${reason}`);
                closeCancelReasonModal();
                checkClientBooking(); // Обновляем список записей
            } catch (err) {
                console.error(err);
                alert('Ошибка соединения с сервером при отмене.');
            }
        }
    </script>
