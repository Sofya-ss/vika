<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запись на маникюр</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Красивые модальные окна в едином стиле */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-card {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            width: 320px;
            border-top: 4px solid #e91e63;
            text-align: left;
        }
        .modal-card h3 {
            color: #c2185b;
            margin-top: 0;
            font-size: 18px;
            text-align: center;
        }
        .modal-card p {
            font-size: 14px;
            color: #444;
            text-align: center;
            margin: 15px 0;
        }
        .modal-card select, .modal-card input {
            margin-top: 10px;
            margin-bottom: 15px;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
        }
        .modal-buttons button {
            margin-top: 0;
        }
        .cancel-modal-btn {
            background-color: #7f8c8d !important;
        }
        .cancel-modal-btn:hover {
            background-color: #6c7a7d !important;
        }
    </style>
</head>
<body>

    <!-- Ссылка на вход для мастера в правом верхнем углу -->
    <div class="top-link">
        <a href="master.html">Кабинет мастера ➔</a>
    </div>

    <!-- Карточка записи -->
    <div class="card">
        <h2>Онлайн-запись на маникюр</h2>
        <p>Заполните форму ниже, чтобы записаться на процедуру:</p>

        <form id="booking-form">
            <label for="name">Ваше имя:</label>
            <input type="text" id="name" placeholder="Введите имя" required>

            <label for="phone">Номер телефона:</label>
            <input type="tel" id="phone" placeholder="+7 (999) 000-00-00" required>

            <label for="service">Выберите услугу:</label>
            <select id="service">
                <option value="Маникюр с покрытием">Маникюр с покрытием</option>
                <option value="Французский маникюр">Французский маникюр (Френч)</option>
                <option value="Педикюр">Педикюр</option>
                <option value="Снятие + Дизайн">Снятие + Дизайн</option>
                <option value="Маникюр с Спанч Бобом">Маникюр с Спанч Бобом</option>
            </select>

            <label for="master">Выберите мастера:</label>
            <select id="master">
                <option value="Любой свободный мастер">Любой свободный мастер</option>
                <option value="Анна">Анна</option>
                <option value="Елена">Елена</option>
            </select>

            <label for="datetime">Дата и время записи:</label>
            <input type="datetime-local" id="datetime" required>

            <button type="submit">Подтвердить запись</button>
        </form>

        <!-- Блок проверки записи клиентом -->
        <hr class="divider">
        <h3>Проверить мою запись</h3>
        <input type="tel" id="search-phone" placeholder="Введите ваш номер телефона">
        <button type="button" onclick="checkClientBooking()" class="secondary-btn">Найти запись</button>
        <div id="client-result" class="result-box"></div>
    </div>

    <!-- Контейнер для модальных окон -->
    <div id="modal-container"></div>

    <script>
        // Установка минимальной даты и времени (текущий момент)
        function setMinDateTime() {
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('datetime').min = now.toISOString().slice(0, 16);
        }

        setMinDateTime();

        // Функция для показа красивых всплывающих сообщений
        function showCustomAlert(title, message) {
            const modalContainer = document.getElementById('modal-container');
            modalContainer.innerHTML = `
                <div class="modal-overlay">
                    <div class="modal-card">
                        <h3>${title}</h3>
                        <p>${message}</p>
                        <button onclick="closeModal()">ОК</button>
                    </div>
                </div>
            `;
        }

        function closeModal() {
            document.getElementById('modal-container').innerHTML = '';
        }

        // Сохранение записи
        document.getElementById('booking-form').addEventListener('submit', function(e) {
            e.preventDefault();

            const selectedDatetime = document.getElementById('datetime').value;
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            const minAllowed = now.toISOString().slice(0, 16);

            // 1. Проверка на прошедшее время
            if (selectedDatetime < minAllowed) {
                showCustomAlert('Ошибка времени', 'Нельзя записаться на прошедшее время! Выберите актуальную дату и час.');
                return;
            }

            // 2. Проверка формата телефона
            const phoneInput = document.getElementById('phone').value.trim();
            const cleanPhone = phoneInput.replace(/\D/g, '');
            
            if (cleanPhone.length < 10 || cleanPhone.length > 11) {
                showCustomAlert('Неверный номер', 'Пожалуйста, введите корректный номер телефона (от 10 до 11 цифр).');
                return;
            }

            const booking = {
                id: Date.now(),
                name: document.getElementById('name').value,
                phone: phoneInput,
                service: document.getElementById('service').value,
                master: document.getElementById('master').value,
                datetime: selectedDatetime
            };

            let bookings = JSON.parse(localStorage.getItem('bookings')) || [];
            bookings.push(booking);
            localStorage.setItem('bookings', JSON.stringify(bookings));

            showCustomAlert('Успешно!', 'Вы успешно записались на процедуру! Спасибо!');
            this.reset();
            setMinDateTime();
        });

        // Поиск записи клиента
        function checkClientBooking() {
            const phone = document.getElementById('search-phone').value.trim();
            const resultDiv = document.getElementById('client-result');
            let bookings = JSON.parse(localStorage.getItem('bookings')) || [];

            if (!phone) {
                resultDiv.innerHTML = "<p>Введите номер телефона для поиска.</p>";
                return;
            }

            const myBookings = bookings.filter(b => b.phone.includes(phone));

            if (myBookings.length === 0) {
                resultDiv.innerHTML = "<p>Записей на этот номер не найдено.</p>";
            } else {
                let html = "<b>Ваши записи:</b><br>";
                myBookings.forEach(b => {
                    const dateObj = new Date(b.datetime);
                    html += `<div class="booking-item">
                        <b>Услуга:</b> ${b.service}<br>
                        <b>Мастер:</b> ${b.master}<br>
                        <b>Дата и время:</b> ${dateObj.toLocaleString('ru-RU')}<br>
                        <button onclick="openCancelModal(${b.id})" class="logout-btn" style="padding: 5px; font-size: 13px; margin-top: 8px;">Отменить запись</button>
                    </div>`;
                });
                resultDiv.innerHTML = html;
            }
        }

        // Открытие красивого окна для выбора причины отмены
        function openCancelModal(id) {
            const modalContainer = document.getElementById('modal-container');
            
            modalContainer.innerHTML = `
                <div class="modal-overlay">
                    <div class="modal-card">
                        <h3>Отмена записи</h3>
                        <label for="cancel-reason-select">Выберите причину отмены:</label>
                        <select id="cancel-reason-select" onchange="toggleOtherInput()">
                            <option value="Болезнь">1. Болезнь</option>
                            <option value="Отъезд">2. Отъезд</option>
                            <option value="Иное">3. Иное</option>
                        </select>
                        
                        <div id="other-reason-box" class="hidden">
                            <label for="other-reason-text">Уточните причину:</label>
                            <input type="text" id="other-reason-text" placeholder="Введите причину...">
                        </div>

                        <div class="modal-buttons">
                            <button onclick="confirmCancel(${id})">Подтвердить</button>
                            <button onclick="closeModal()" class="cancel-modal-btn">Назад</button>
                        </div>
                    </div>
                </div>
            `;
        }

        // Показ поля ввода при выборе пункта "Иное"
        function toggleOtherInput() {
            const selectVal = document.getElementById('cancel-reason-select').value;
            const otherBox = document.getElementById('other-reason-box');
            if (selectVal === 'Иное') {
                otherBox.classList.remove('hidden');
            } else {
                otherBox.classList.add('hidden');
            }
        }

        // Подтверждение отмены записи
        function confirmCancel(id) {
            let reason = document.getElementById('cancel-reason-select').value;
            
            if (reason === 'Иное') {
                const customText = document.getElementById('other-reason-text').value.trim();
                if (customText) {
                    reason = 'Иное: ' + customText;
                } else {
                    alert('Пожалуйста, уточните причину в поле ввода.');
                    return;
                }
            }

            let bookings = JSON.parse(localStorage.getItem('bookings')) || [];
            bookings = bookings.filter(b => b.id !== id);
            localStorage.setItem('bookings', JSON.stringify(bookings));

            showCustomAlert('Запись отменена', 'Ваша запись была успешно удалена. Причина: ' + reason);
            setTimeout(() => { checkClientBooking(); }, 100);
        }
    </script>
</body>
</html>
