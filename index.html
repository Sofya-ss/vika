<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запись на маникюр</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Ссылка на вход для мастера в правом верхнем углу -->
    <div class="top-link">
        <a href="master.html">Кабинет мастера ➔</a>
    </div>

    <!-- Карточка записи -->
    <div class="card">
        <h2>Онлайн-запись на маникюр</h2>
        <p>Заполните форму ниже, чтобы записаться на процедуру:</p>

        <form id="booking-form">
            <label for="name">Ваше имя:</label>
            <input type="text" id="name" placeholder="Введите имя" required>

            <label for="phone">Номер телефона:</label>
            <input type="tel" id="phone" placeholder="+7 (999) 000-00-00" required>

            <label for="service">Выберите услугу:</label>
            <select id="service">
                <option value="Маникюр с покрытием">Маникюр с покрытием</option>
                <option value="Французский маникюр">Французский маникюр (Френч)</option>
                <option value="Педикюр">Педикюр</option>
                <option value="Снятие + Дизайн">Снятие + Дизайн</option>
                <option value="Маникюр с Спанч Бобом">Маникюр с Спанч Бобом</option>
            </select>

            <label for="master">Выберите мастера:</label>
            <select id="master">
                <option value="Любой свободный мастер">Любой свободный мастер</option>
                <option value="Анна">Анна</option>
                <option value="Елена">Елена</option>
            </select>

            <label for="datetime">Дата и время записи:</label>
            <input type="datetime-local" id="datetime" required>

            <button type="submit">Подтвердить запись</button>
        </form>

        <!-- Блок проверки записи клиентом -->
        <hr class="divider">
        <h3>Проверить мою запись</h3>
        <input type="tel" id="search-phone" placeholder="Введите ваш номер телефона">
        <button type="button" onclick="checkClientBooking()" class="secondary-btn">Найти запись</button>
        <div id="client-result" class="result-box"></div>
    </div>

    <script>
        // Функция для установки минимального времени (текущий момент)
        function setMinDateTime() {
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('datetime').min = now.toISOString().slice(0, 16);
        }

        // Устанавливаем минимальную дату при загрузке страницы
        setMinDateTime();

        // Сохранение записи с проверкой времени и телефона
        document.getElementById('booking-form').addEventListener('submit', function(e) {
            e.preventDefault();

            const selectedDatetime = document.getElementById('datetime').value;
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            const minAllowed = now.toISOString().slice(0, 16);

            // 1. Проверка на прошедшее время
            if (selectedDatetime < minAllowed) {
                alert('Нельзя записаться на прошедшее время!');
                return;
            }

            // 2. Проверка формата телефона
            const phoneInput = document.getElementById('phone').value.trim();
            const cleanPhone = phoneInput.replace(/\D/g, '');
            
            if (cleanPhone.length < 10 || cleanPhone.length > 11) {
                alert('Неверный формат телефона! Пожалуйста, введите корректный номер.');
                return;
            }

            const booking = {
                name: document.getElementById('name').value,
                phone: phoneInput,
                service: document.getElementById('service').value,
                master: document.getElementById('master').value,
                datetime: selectedDatetime
            };let bookings = JSON.parse(localStorage.getItem('bookings')) || [];
            bookings.push(booking);
            localStorage.setItem('bookings', JSON.stringify(bookings));

            alert('Вы успешно записались! Спасибо!');
            this.reset();
            setMinDateTime();
        });

        // Проверка записи по телефону
        function checkClientBooking() {
            const phone = document.getElementById('search-phone').value.trim();
            const resultDiv = document.getElementById('client-result');
            let bookings = JSON.parse(localStorage.getItem('bookings')) || [];

            const myBookings = bookings.filter(b => b.phone.includes(phone));

            if (myBookings.length === 0) {
                resultDiv.innerHTML = "<p>Записей на этот номер не найдено.</p>";
            } else {
                let html = "<b>Ваши записи:</b><br>";
                myBookings.forEach(b => {
                    const dateObj = new Date(b.datetime);
                    html += `<div class="booking-item">
                        <b>Услуга:</b> ${b.service}<br>
                        <b>Мастер:</b> ${b.master}<br>
                        <b>Дата и время:</b> ${dateObj.toLocaleString('ru-RU')}
                    </div>`;
                });
                resultDiv.innerHTML = html;
            }
        }
    </script>
</body>
</html>
